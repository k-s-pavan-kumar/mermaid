<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meridian — Offline</title>
<style>
  html,body{height:100%;margin:0;}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#F6F4FE;color:#1B1240;
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    text-align:center;padding:24px;
  }
  .card{max-width:360px;}
  img{width:140px;height:140px;margin-bottom:8px;}
  h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:22px;margin:0 0 8px;}
  p{color:#6E69A0;font-size:14px;line-height:1.5;margin:0 0 20px;}
  button{
    font:inherit;font-weight:500;font-size:13px;cursor:pointer;
    background:#5F3DEB;color:#fff;border:none;border-radius:8px;
    padding:10px 18px;
  }
  button:hover{background:#4d2fd1;}
</style>
</head>
<body>
  <div class="card">
    <img src="/mascot/worried.png" alt="" />
    <h1>You're offline</h1>
    <p>Meridian can't reach the network right now. Check your connection — anything you've already opened may still be cached.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
